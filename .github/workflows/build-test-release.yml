name: CI/CD Multi-Platform Build & Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    name: Build & Test (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux amd64 (x86_64)
          - os: ubuntu-24.04
            arch: x86_64
            cmake_arch: ""
            artifact_name: AetherHelm-Linux-x86_64
            archive_ext: tar.gz
          # Linux arm64 (aarch64)
          - os: ubuntu-24.04-arm
            arch: arm64
            cmake_arch: ""
            artifact_name: AetherHelm-Linux-arm64
            archive_ext: tar.gz
          # macOS x86_64 (Intel)
          - os: macos-15-intel
            arch: x86_64
            cmake_arch: ""
            osx_arch: x86_64
            artifact_name: AetherHelm-macOS-x86_64
            archive_ext: zip
          # macOS arm64 (Apple Silicon)
          - os: macos-14
            arch: arm64
            cmake_arch: ""
            osx_arch: arm64
            artifact_name: AetherHelm-macOS-arm64
            archive_ext: zip
          # Windows amd64 (x64)
          - os: windows-2022
            arch: x64
            cmake_arch: x64
            artifact_name: AetherHelm-Windows-x64
            archive_ext: zip
          # Windows arm64
          - os: windows-11-arm
            arch: arm64
            cmake_arch: ARM64
            artifact_name: AetherHelm-Windows-arm64
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Linux Dependencies
      - name: Install Linux audio and graphical dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            libfreetype6-dev \
            libx11-dev \
            libxcomposite-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libcurl4-openssl-dev \
            ninja-build

      # Linux setup
      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      # macOS native build (x86_64 or arm64)
      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }}

      # Windows MSVC setup (x64 or ARM64)
      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -B build -G "Visual Studio 17 2022" -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release

      # Compilation
      - name: Build All Targets (Plugin, MCP Server, Tests)
        run: cmake --build build --config Release --parallel 4

      # Automated Testing
      - name: Run Test Suite
        run: ctest --test-dir build -C Release --output-on-failure

      # Packaging Linux
      - name: Package Artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp -r build/AetherHelm_artefacts/Release/* dist/ 2>/dev/null || true
          cp -r build/AetherHelm_artefacts/* dist/ 2>/dev/null || true
          find build -type f -name "aetherhelm-mcp" -exec cp {} dist/ \; 2>/dev/null || true
          cp -r scripts dist/
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist .

      # Packaging macOS
      - name: Package Artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp -r build/AetherHelm_artefacts/Release/* dist/ 2>/dev/null || true
          cp -r build/AetherHelm_artefacts/* dist/ 2>/dev/null || true
          find build -type f -name "aetherhelm-mcp" -exec cp {} dist/ \; 2>/dev/null || true
          cp -r scripts dist/
          cd dist && zip -r ../${{ matrix.artifact_name }}.zip .

      # Packaging Windows
      - name: Package Artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if (Test-Path build/AetherHelm_artefacts) {
            Copy-Item -Path build/AetherHelm_artefacts/* -Destination dist -Recurse -Force -ErrorAction SilentlyContinue
          }
          Get-ChildItem -Path build -Filter "aetherhelm-mcp.exe" -Recurse | ForEach-Object { Copy-Item $_.FullName -Destination dist }
          Copy-Item -Recurse scripts dist/
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.artifact_name }}.zip"

      # Upload CI Artifact
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            **/*.tar.gz
            **/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}